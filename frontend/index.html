<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatCafe Pro | ระบบจัดการร้าน</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <nav>
        <div class="logo">CatCafe Pro</div>
        <div class="auth-controls" id="auth-controls" style="display: none;">
            <span class="user-info" id="nav-user-info">ยินดีต้อนรับ, ผู้ใช้</span>
            <button class="btn btn-danger" style="padding: 0.5rem 1rem;" onclick="logout()">ออกจากระบบ</button>
        </div>
    </nav>

    <div class="container" id="app-container">
        <aside id="sidebar">
            <!-- Sidebar content injected by JS -->
        </aside>

        <main id="main-content">
            <!-- Pages will be dynamically loaded here by app.js -->

            <!-- Info Modal -->
            <div id="info-modal" class="modal">
                <div class="modal-content" style="width: 500px;">
                    <h2 id="info-modal-title" style="margin-bottom: 1rem; color: var(--accent); font-family: 'Playfair Display', serif;">รายละเอียด</h2>
                    <div id="info-modal-body" style="margin-bottom: 1.5rem; max-height: 400px; overflow-y: auto;"></div>
                    <div style="display: flex; gap: 1rem;">
                        <button class="btn btn-p" style="flex: 1;" onclick="document.getElementById('info-modal').classList.remove('active')">ปิด</button>
                        <button id="info-modal-delete-btn" class="btn btn-danger" style="flex: 1; display: none;">ลบข้อมูลนี้</button>
                    </div>
                </div>
            </div>

            <!-- Add Modal -->
            <div id="add-modal" class="modal">
                <div class="modal-content" style="width: 500px;">
                    <h2 id="add-modal-title" style="margin-bottom: 1rem; color: var(--accent); font-family: 'Playfair Display', serif;">เพิ่มข้อมูล</h2>
                    <form id="add-form" onsubmit="submitAddForm(event)">
                        <div id="add-form-fields" style="max-height: 400px; overflow-y: auto; margin-bottom: 1rem; padding-right: 0.5rem;"></div>
                        <div style="display: flex; gap: 1rem;">
                            <button type="submit" class="btn btn-p" style="flex: 1;">บันทึก</button>
                            <button type="button" class="btn btn-danger" style="flex: 1;" onclick="document.getElementById('add-modal').classList.remove('active')">ยกเลิก</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
