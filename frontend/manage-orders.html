<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NekoCafe Admin - Manage Orders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>NekoCafe</h2>
                <span class="text-muted">Admin System</span>
            </div>
            <ul class="nav-menu">
                <li><a href="admin.html">📊 แดชบอร์ด (Dashboard)</a></li>
                <li><a href="manage-cats.html">🐈 จัดการแมว</a></li>
                <li><a href="manage-orders.html" class="active">☕ จัดการออเดอร์</a></li>
                <li style="margin-top: 40px; border-top: 1px solid #e5e7eb; padding-top: 10px;">
                    <a href="index.html">⬅️ กลับหน้า Customer</a>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <h1>จัดการออเดอร์ลูกค้า</h1>
            <p class="text-muted">ติดตามสถานะการสั่งอาหารและเครื่องดื่ม</p>

            <div class="card mt-2">
                <table style="width: 100%; text-align: left; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border-color);">
                            <th style="padding: 12px 0;">รหัส</th>
                            <th>รายการ</th>
                            <th>ราคา</th>
                            <th>ลูกค้า</th>
                            <th>สถานะ</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="border-bottom: 1px solid var(--border-color);">
                            <td style="padding: 12px 0;">#1042</td>
                            <td>Matcha Latte (x1)</td>
                            <td>฿85</td>
                            <td>Alice</td>
                            <td><span class="badge badge-warning">กำลังเตรียม</span></td>
                            <td>
                                <button class="btn btn-primary" style="padding: 4px 8px;">เสร็จสิ้น</button>
                            </td>
                        </tr>
                        <tr style="border-bottom: 1px solid var(--border-color);">
                            <td style="padding: 12px 0;">#1041</td>
                            <td>Iced Americano (x2)</td>
                            <td>฿130</td>
                            <td>Bob</td>
                            <td><span class="badge badge-success">เสร็จแล้ว</span></td>
                            <td>
                                <button class="btn btn-secondary" style="padding: 4px 8px;">เช็คบิล</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
