

services:
  backend:
    build: ./backend
    container_name: catcafe-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
      - ./frontend:/frontend
    environment:
      - PORT=5000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=catcafe2024
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5.15.0
    container_name: catcafe-neo4j
    ports:
      - "7474:7474" # HTTP (UI)
      - "7687:7687" # Bolt (Driver)
    environment:
      - NEO4J_AUTH=neo4j/catcafe2024
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
