

services:
  backend:
    build: ./backend
    container_name: catcafe-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - PORT=5000
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:5.15.0
    container_name: catcafe-neo4j
    ports:
      - "7474:7474" # HTTP (UI)
      - "7687:7687" # Bolt (Driver)
    environment:
      - NEO4J_AUTH=neo4j/catcafe2024
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
